name: core-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # The SOLIDWORKS add-in needs the SOLIDWORKS interop assemblies and is built on Windows only.
      - run: dotnet test tests/GeoSimplifier.Core.Tests
