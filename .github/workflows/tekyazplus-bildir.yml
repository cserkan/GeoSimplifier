name: tekyazplus-bildir

on:
  push:

jobs:
  bildir:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: TekyazPlus'a "modül güncellendi" gönder
        env:
          TOKEN: ${{ secrets.TEKYAZPLUS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "TEKYAZPLUS_TOKEN tanımlı değil; TekyazPlus gece kontrolünde güncellenecek."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/cserkan/TekyazPlus/dispatches \
            -d "{\"event_type\":\"modul-guncellendi\",\"client_payload\":{\"modul\":\"${{ github.repository }}\",\"commit\":\"${{ github.sha }}\"}}"
